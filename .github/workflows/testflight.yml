name: TestFlight

# Builds a signed release and uploads it to App Store Connect, so the app shows up in the
# TestFlight app on your iPhone. Run it from the Actions tab → TestFlight → Run workflow.
#
# Needs a paid Apple Developer account and these repository secrets
# (GitHub → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com → Membership)
#   BUNDLE_ID             e.g. com.yourname.mpcoaching (must match the app in App Store Connect)
#   ASC_KEY_ID            App Store Connect API key id (Users and Access → Integrations → Keys, role: App Manager)
#   ASC_ISSUER_ID         Issuer id shown on that same page
#   ASC_KEY_P8_BASE64     The downloaded AuthKey_XXXX.p8 file, base64-encoded
# Optional, to turn on leaderboards:
#   CLOUDKIT_CONTAINER    e.g. iCloud.com.yourname.mpcoaching (create it under Identifiers → iCloud Containers)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Turn on CloudKit (if configured)
        env:
          CLOUDKIT_CONTAINER: ${{ secrets.CLOUDKIT_CONTAINER }}
        run: |
          if [ -z "$CLOUDKIT_CONTAINER" ]; then echo "No CLOUDKIT_CONTAINER: building without leaderboards."; exit 0; fi
          E=MPCoaching.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers array" $E
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers:0 string $CLOUDKIT_CONTAINER" $E
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services array" $E
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services:0 string CloudKit" $E
          sed -i '' "s|static let cloudKitContainerID: String? = nil|static let cloudKitContainerID: String? = \"$CLOUDKIT_CONTAINER\"|" MPCoaching/Models/AppConfig.swift
          grep cloudKitContainerID MPCoaching/Models/AppConfig.swift

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MPCoaching.xcodeproj \
            -scheme MPCoaching \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MPCoaching.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MPCoaching.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Show errors
        if: failure()
        run: grep -E "error:" archive.log | sort -u | head -50 || true
