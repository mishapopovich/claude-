# Fallback project definition for XcodeGen (brew install xcodegen; xcodegen generate).
# Only needed if MPCoaching.xcodeproj ever fails to open or you want to regenerate it.
name: MPCoaching
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  MPCoaching:
    type: application
    platform: iOS
    sources:
      - MPCoaching
    entitlements:
      path: MPCoaching.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mpcoaching
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: MP Coaching
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MP Coaching reads steps, active energy, sleep, heart rate, body weight, workouts and the calories and macros your food app saves, to show them on the Today screen and give your coach context. Nothing is uploaded except summary numbers in coach chats you send with your own API key."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MP Coaching saves your finished workouts and the body weights you log to Apple Health."
